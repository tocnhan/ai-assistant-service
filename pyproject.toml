[project]
name = "ai-assistant-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "anthropic>=0.102.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "google-genai>=2.4.0",
    "jinja2>=3.1.6",
    "openai>=2.37.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-ai>=1.97.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "redis[asyncio]>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "sse-starlette>=3.4.4",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
